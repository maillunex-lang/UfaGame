name: Install pinned Godot
description: Godot 4.6.3 official for headless checks
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/godot"
        curl -fL --retry 3 -o "$RUNNER_TEMP/godot.zip" https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
        unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
        ln -s "$RUNNER_TEMP/godot/Godot_v4.6.3-stable_linux.x86_64" "$RUNNER_TEMP/godot/godot"
        echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
