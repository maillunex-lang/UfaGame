name: Repository checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install pinned dependencies and scanner
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          bash tools/install-gitleaks.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: npm run check
  godot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: ./.github/actions/setup-godot
      - name: Headless prototype checks
        run: npm run check:game
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/godot-data
          XDG_CONFIG_HOME: ${{ runner.temp }}/godot-config
          XDG_CACHE_HOME: ${{ runner.temp }}/godot-cache
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: ./.github/actions/setup-godot
      - run: npx playwright install --with-deps chromium
      - run: npm run test:integration
