services:
  db:
    image: postgres:18.4-bookworm@sha256:882236b897e39051d2368c5ccc6cda944904723506b2dfc97f2a8f5bc9afa382
    environment:
      POSTGRES_USER: ufagame
      POSTGRES_DB: ufagame_test
      POSTGRES_PASSWORD: ${S52_DB_PASSWORD:?Set S52_DB_PASSWORD privately}
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ufagame -d ufagame_test"]
      interval: 10s
      timeout: 3s
      retries: 10
    mem_limit: 256m
    restart: unless-stopped
  api:
    build:
      context: ../..
      dockerfile: infra/studio-test/Dockerfile
    environment:
      DATABASE_URL: postgres://ufagame:${S52_DB_PASSWORD:?Set S52_DB_PASSWORD privately}@db:5432/ufagame_test
      API_HOST: 0.0.0.0
      API_PORT: '8055'
      ADMIN_ORIGIN: https://tts-ufa.ru
      ADMIN_COOKIE_PATH: /game/server/admin/v1
    depends_on:
      db:
        condition: service_healthy
    ports:
      - 127.0.0.1:${S52_API_PORT:-8055}:8055
    mem_limit: 512m
    restart: unless-stopped
volumes:
  db_data:
